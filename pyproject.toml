[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceagent"
version = "0.1.0"
description = "Open-source, self-hosted AI voice agent: inbound and outbound calls that book real meetings. Bring your own keys."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hamza El Sousi" }]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "websockets>=12,<13",
    "anthropic>=0.39",
    "twilio>=8,<9",
    "pyyaml>=6",
    "pydantic>=2.5",
    "typer>=0.9",
    "aiofiles>=23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Platform: accounts, workspaces, encrypted keys (Postgres in production, SQLite for dev/tests)
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
voiceagent = "voiceagent.cli:app"

[tool.setuptools.packages.find]
include = ["voiceagent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
voiceagent = ["web/static/*", "web/templates/*", "app/agent_templates/*.yaml", "app/migrations/*", "app/migrations/versions/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["voiceagent/app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
