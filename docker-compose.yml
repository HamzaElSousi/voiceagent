# Self-hosted VoiceAgent. On a VPS with a domain pointing at it:
#   voiceagent init-instance --domain voice.example.com   (or copy .env.example and fill it in)
#   docker compose up -d
#   docker compose run --rm app create-admin
# Full guide: docs/SELF_HOSTING.md

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    image: ${VOICEAGENT_IMAGE:-ghcr.io/hamzaelsousi/voiceagent:latest}
    restart: unless-stopped
    command: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceagent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/voiceagent
      PUBLIC_BASE_URL: https://${DOMAIN}
      PORT: "8080"
    volumes:
      - call_logs:/app/call_logs
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ${VOICEAGENT_IMAGE:-ghcr.io/hamzaelsousi/voiceagent:latest}
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceagent:${POSTGRES_PASSWORD}@postgres:5432/voiceagent
      PUBLIC_BASE_URL: https://${DOMAIN}
    volumes:
      - call_logs:/app/call_logs
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy   # the app applies migrations first

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: voiceagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent -d voiceagent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  call_logs:
  caddy_data:
  caddy_config:
